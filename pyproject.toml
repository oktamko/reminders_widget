[project]
name = "reminders-widget"
dynamic = ["version"]
requires-python = ">=3.12"
dependencies = [
    "pywebview==6.2.1",   # pinned: app/signin.py reads cookies through its internals
    "httpx>=0.27",
    "Pillow>=10",
    "pystray>=0.19",
]

[project.optional-dependencies]
dev = ["pytest>=8", "playwright>=1.45"]
build = ["pyinstaller>=6.6"]
probe = ["pywebview>=5", "httpx>=0.27", "Pillow"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "reminders_widget.project.VERSION"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"reminders_widget.app" = ["ui/*.html", "ui/*.css", "ui/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests", "probes"]
pythonpath = ["src", "probes"]
