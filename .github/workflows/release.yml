name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # publish the release
  actions: read     # SignPath downloads the uploaded artifacts of this run

# Signing runs only once SignPath is set up: repository variable SIGNPATH_ORGANIZATION_ID and
# secret SIGNPATH_API_TOKEN. Each signing request waits for a manual approval in SignPath;
# a rejected or timed-out request fails the job, so nothing unsigned is published then.
jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # no write token on disk while dependencies install and run
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches the version
        shell: bash
        run: python packaging/check_tag.py "$TAG"
      - name: Install
        run: python -m pip install -e ".[dev,probe,build]"
      - name: Test
        run: python -m pytest -q
      - name: Build app
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File packaging/build.ps1
      - name: Upload app for signing
        id: upload-app
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: app-unsigned
          path: dist/RemindersWidget/RemindersWidget.exe
          if-no-files-found: error
      - name: Sign app
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: reminders_widget
          signing-policy-slug: release-signing
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.upload-app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600   # time for the manual approval
          output-artifact-directory: dist/RemindersWidget
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build installer
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File packaging/build.ps1 -InstallerOnly
      - name: Upload installer for signing
        id: upload-installer
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: installer-unsigned
          path: packaging/Output/*.exe
          if-no-files-found: error
      - name: Sign installer
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: reminders_widget
          signing-policy-slug: release-signing
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: packaging/Output
      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem packaging/Output/*.exe | ForEach-Object {
            "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content packaging/Output/SHA256SUMS.txt -Encoding ascii
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$TAG" packaging/Output/*.exe packaging/Output/SHA256SUMS.txt
          --title "Reminders Widget $TAG" --notes-file .github/release-notes.md --generate-notes
