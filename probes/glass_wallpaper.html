<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<title>Glass from wallpaper probe</title>
<style>
  :root { --margin: 40px; --bg: #000; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
  body { font-family: "ProbeSans", "Segoe UI", sans-serif; color: #fff; }
  /* The card fills the window; DWM rounds the window corners, the radius here only
     matches it so the rim highlight follows the same curve. */
  .card { position: absolute; inset: 0; overflow: hidden; border-radius: 8px;
          box-shadow: inset 0 1px 0 rgba(255,255,255,.45), inset 0 0 0 1px rgba(255,255,255,.28),
                      inset 0 -1px 0 rgba(255,255,255,.12); }
  /* Crop arrives margin px larger on every side, so blurred edges fall outside the card. */
  .layer { position: absolute; inset: calc(-1 * var(--margin)); background-size: 100% 100%;
           background-repeat: no-repeat; }
  .blur { filter: blur(24px) saturate(1.7); }
  /* Rim: same image, displaced by noise, visible only in a ring along the edge. */
  .rim { filter: url(#bend) saturate(1.7);
         -webkit-mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
         -webkit-mask-composite: xor; mask-composite: exclude;
         padding: calc(var(--margin) + 14px); box-sizing: border-box; }
  .tint { position: absolute; inset: 0; background: rgba(255,255,255,.12); }
  .content { position: absolute; inset: 0; padding: 18px 20px; box-sizing: border-box; }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 12px; opacity: .9; }
  .row { display: flex; gap: 10px; align-items: baseline; padding: 9px 0;
         border-top: 1px solid rgba(255,255,255,.14); font-size: 14px; }
  .row:first-of-type { border-top: 0; }
  .dot { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.7);
         flex: none; align-self: center; }
  .prio { color: #ff9f0a; font-weight: 700; min-width: 28px; }
</style>
<script>
  const m = location.hash.match(/font=([^&]+)/);
  if (m) {
    const face = new FontFace("ProbeSans", "url(" + decodeURIComponent(m[1]) + ")");
    face.load().then(f => { document.fonts.add(f); window.__fontState = "načítané"; })
              .catch(() => { window.__fontState = "zlyhalo, sans-serif"; });
  } else { window.__fontState = "bez písma, sans-serif"; }

  // Called from Python: url = JPEG data URL of the wallpaper behind the window (+ margin).
  window.setWallpaper = function (url, bg) {
    document.documentElement.style.setProperty("--bg", bg);
    for (const el of document.querySelectorAll(".layer"))
      el.style.backgroundImage = 'url("' + url + '")';
    window.__wallpaperSet = (window.__wallpaperSet || 0) + 1;
    return window.__wallpaperSet;
  };
</script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="bend" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="28" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>
  <div class="card">
    <div class="layer blur"></div>
    <div class="layer rim"></div>
    <div class="tint"></div>
    <div class="content">
      <h1>Dnes</h1>
      <div class="row"><span class="dot"></span><span class="prio">!!!</span><span>Ukážkový riadok s vysokou prioritou</span></div>
      <div class="row"><span class="dot"></span><span class="prio">!!</span><span>Stredná priorita, diakritika: ľščťžýáíé</span></div>
      <div class="row"><span class="dot"></span><span class="prio">!</span><span>Nízka priorita</span></div>
      <div class="row"><span class="dot"></span><span class="prio"></span><span>Bez priority</span></div>
      <div class="row"><span class="dot"></span><span class="prio"></span><span>Ďalší ukážkový riadok</span></div>
    </div>
  </div>
</body>
</html>
