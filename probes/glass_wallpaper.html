<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<title>Glass from wallpaper probe</title>
<style>
  :root { --bg: #000; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
  body { font-family: "ProbeSans", "Segoe UI", sans-serif; color: #fff; }
  /* One uniform frosted surface: the pre-blurred virtual-screen image, moved so it stays
     fixed on the screen while the window moves. DWM rounds the window corners. */
  .card { position: absolute; inset: 0; overflow: hidden; }
  .layer { position: absolute; left: 0; top: 0; background-size: 100% 100%;
           background-repeat: no-repeat; will-change: transform; }
  .tint { position: absolute; inset: 0; background: rgba(255,255,255,.12); }
  .edge { position: absolute; inset: 0; pointer-events: none;
          box-shadow: inset 0 1px 0 rgba(255,255,255,.45), inset 0 -1px 0 rgba(255,255,255,.12); }
  .content { position: absolute; inset: 0; padding: 18px 20px; box-sizing: border-box; }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 12px; opacity: .9; }
  .row { display: flex; gap: 10px; align-items: baseline; padding: 9px 0;
         border-top: 1px solid rgba(255,255,255,.14); font-size: 14px; }
  .row:first-of-type { border-top: 0; }
  .dot { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.7);
         flex: none; align-self: center; }
  .prio { color: #ff9f0a; font-weight: 700; min-width: 28px; }
</style>
<script>
  const m = location.hash.match(/font=([^&]+)/);
  if (m) {
    const face = new FontFace("ProbeSans", "url(" + decodeURIComponent(m[1]) + ")");
    face.load().then(f => { document.fonts.add(f); window.__fontState = "načítané"; })
              .catch(() => { window.__fontState = "zlyhalo, sans-serif"; });
  } else { window.__fontState = "bez písma, sans-serif"; }

  const glass = { ox: 0, oy: 0, cx: 0, cy: 0, running: false };

  // Called from Python: url = image of the whole virtual screen (CSS px size w x h), whose
  // top-left sits at (ox, oy) CSS px on the screen; (cx, cy) corrects screenX/Y if needed.
  window.setGlass = function (url, ox, oy, w, h, cx, cy) {
    const layer = document.querySelector(".layer");
    layer.style.backgroundImage = 'url("' + url + '")';
    layer.style.width = w + "px"; layer.style.height = h + "px";
    Object.assign(glass, { ox, oy, cx, cy });
    if (!glass.running) { glass.running = true; requestAnimationFrame(frame); }
    return true;
  };

  function frame() {
    const layer = document.querySelector(".layer");
    const x = glass.ox - (window.screenX + glass.cx);
    const y = glass.oy - (window.screenY + glass.cy);
    layer.style.transform = "translate3d(" + x + "px," + y + "px,0)";
    requestAnimationFrame(frame);
  }

  window.__sample = function () {
    return { sx: window.screenX, sy: window.screenY, iw: innerWidth, ih: innerHeight,
             ow: outerWidth, oh: outerHeight, dpr: devicePixelRatio };
  };
</script>
</head>
<body>
  <div class="card">
    <div class="layer"></div>
    <div class="tint"></div>
    <div class="edge"></div>
    <div class="content">
      <h1>Dnes</h1>
      <div class="row"><span class="dot"></span><span class="prio">!!!</span><span>Ukážkový riadok s vysokou prioritou</span></div>
      <div class="row"><span class="dot"></span><span class="prio">!!</span><span>Stredná priorita, diakritika: ľščťžýáíé</span></div>
      <div class="row"><span class="dot"></span><span class="prio">!</span><span>Nízka priorita</span></div>
      <div class="row"><span class="dot"></span><span class="prio"></span><span>Bez priority</span></div>
      <div class="row"><span class="dot"></span><span class="prio"></span><span>Ďalší ukážkový riadok</span></div>
    </div>
  </div>
</body>
</html>
